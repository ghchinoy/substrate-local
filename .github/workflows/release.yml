name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Dry-run version string (does not publish a GitHub Release)"
        required: false
        default: "v0.0.0-dryrun"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify
        run: |
          go vet ./...
          go test -race -count=1 ./...
          bash -n scripts/*.sh

      - name: Build release archives
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/ghchinoy/substrate-local/internal/version.Version=${VERSION} -X github.com/ghchinoy/substrate-local/internal/version.Commit=${COMMIT} -X github.com/ghchinoy/substrate-local/internal/version.Date=${BUILD_DATE}"
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            STAGE="dist/stage-${GOOS}-${GOARCH}"
            mkdir -p "${STAGE}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="${LDFLAGS}" -o "${STAGE}/substrate-local" ./cmd/substrate-local
            cp LICENSE README.md "${STAGE}/"
            ARCHIVE="substrate-local_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
            tar -C "${STAGE}" -czf "dist/${ARCHIVE}" substrate-local LICENSE README.md
            rm -rf "${STAGE}"
          done
          (cd dist && sha256sum substrate-local_*.tar.gz > checksums.txt)
          cat dist/checksums.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${TAG}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${TAG}" dist/substrate-local_*.tar.gz dist/checksums.txt \
            --title "substrate-local ${TAG}" \
            --generate-notes \
            ${PRERELEASE_FLAG}
